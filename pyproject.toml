[project]
name = "ornn-analysis"
version = "0.1.0"
description = "Daily signals on how the physical world (supply, demand, memory, energy) moves GPU compute prices"
requires-python = ">=3.11"

[project.scripts]
ornn-daily = "ornn_analysis.daily:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
